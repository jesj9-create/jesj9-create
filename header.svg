<svg fill="none" viewBox="0 0 850 320" width="850" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#0d1117" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="55%">
      <stop offset="40%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="850" height="320" fill="#0d1117" />

  <image href="./banner.jpg" width="850" height="320" preserveAspectRatio="xMidYMid slice" opacity="0.45"/>

  <rect width="850" height="320" fill="url(#fadeBottom)" />
  <rect width="850" height="320" fill="url(#vignette)" />

  <text x="425" y="215" text-anchor="middle" fill="#ffffff" filter="url(#neonGlow)" font-family="Courier New, Consolas, monospace" font-size="30" font-weight="bold" letter-spacing="2">
    hAcKeD bY AnGeL oF tHe NiGhT
  </text>
</svg>
